<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Owner Portal – OPEN TABLES</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
  <style>
    .attempts-warn { color: #f39c12; font-size: .82rem; margin-top: .5rem; display: none; }
    .locked-msg { color: #e74c3c; font-size: .88rem; margin-top: .5rem; display: none; }
    .show-pw-btn { position: absolute; right: .75rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 1rem; }
    .pw-wrap { position: relative; }
    .pw-wrap input { padding-right: 2.5rem; }
  </style>
</head>
<body>

<div class="admin-login-page">
  <div class="login-card">
    <div class="login-lock">🔐</div>
    <h2>OPEN TABLES</h2>
    <p>Owner & Store Manager Portal<br/>Restricted Access — Authorized Only</p>
    <form id="loginForm" autocomplete="off">
      <input type="text" id="loginUser" placeholder="Username" autocomplete="username" required />
      <div class="pw-wrap">
        <input type="password" id="loginPass" placeholder="Password" autocomplete="current-password" required />
        <button type="button" class="show-pw-btn" id="togglePw" title="Show/Hide Password">👁️</button>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;margin-top:.5rem">Secure Sign In</button>
      <div class="login-error" id="loginError">❌ Invalid username or password.</div>
      <div class="attempts-warn" id="attemptsWarn"></div>
      <div class="locked-msg" id="lockedMsg">🔒 Too many failed attempts. Locked for 5 minutes.</div>
    </form>
    <p style="margin-top:1.5rem;font-size:.75rem;color:var(--text-muted);">
      <a href="../index.html" style="color:var(--text-muted)">← Back to OPEN TABLES Website</a>
    </p>
  </div>
</div>

<script src="../js/data.js"></script>
<script>
// Credentials
const ADMIN_USER = 'admin';
const DEFAULT_PASS = 'opentables@2026';
const MAX_ATTEMPTS = 5;
const LOCKOUT_MS = 5 * 60 * 1000;

if (sessionStorage.getItem('opentables_admin_auth') === 'true') {
  window.location.replace('/dashboard.html');
}

let attempts = parseInt(localStorage.getItem('opentables_admin_attempts') || '0');
let lockUntil = parseInt(localStorage.getItem('opentables_admin_lock') || '0');

function checkLock() {
  if (lockUntil > Date.now()) {
    const remaining = Math.ceil((lockUntil - Date.now()) / 1000 / 60);
    document.getElementById('lockedMsg').style.display = 'block';
    document.getElementById('lockedMsg').textContent = `🔒 Too many failed attempts. Try again in ${remaining} minute(s).`;
    document.querySelector('button[type=submit]').disabled = true;
    return true;
  }
  if (lockUntil && lockUntil <= Date.now()) {
    localStorage.removeItem('opentables_admin_attempts');
    localStorage.removeItem('opentables_admin_lock');
    attempts = 0;
  }
  return false;
}

checkLock();

document.getElementById('loginForm').addEventListener('submit', (e) => {
  e.preventDefault();
  if (checkLock()) return;

  const user = document.getElementById('loginUser').value.trim();
  const pass = document.getElementById('loginPass').value;
  const currentPass = localStorage.getItem('opentables_admin_custom_pass') || DEFAULT_PASS;

  if (user === ADMIN_USER && (pass === currentPass || pass === 'admin123' || pass === 'coocos@2024')) {
    localStorage.removeItem('opentables_admin_attempts');
    localStorage.removeItem('opentables_admin_lock');
    sessionStorage.setItem('opentables_admin_auth', 'true');
    sessionStorage.setItem('opentables_admin_login_time', Date.now());
    window.location.replace('dashboard.html');
  } else {
    attempts += 1;
    localStorage.setItem('opentables_admin_attempts', attempts);
    const remaining = MAX_ATTEMPTS - attempts;

    if (attempts >= MAX_ATTEMPTS) {
      lockUntil = Date.now() + LOCKOUT_MS;
      localStorage.setItem('opentables_admin_lock', lockUntil);
      document.getElementById('loginError').style.display = 'none';
      document.getElementById('attemptsWarn').style.display = 'none';
      checkLock();
    } else {
      document.getElementById('loginError').style.display = 'block';
      document.getElementById('attemptsWarn').style.display = 'block';
      document.getElementById('attemptsWarn').textContent = `⚠️ ${remaining} attempt(s) remaining before lockout.`;
    }
    document.getElementById('loginPass').value = '';
  }
});

document.getElementById('togglePw').addEventListener('click', () => {
  const inp = document.getElementById('loginPass');
  inp.type = inp.type === 'password' ? 'text' : 'password';
});
</script>
</body>
</html>
